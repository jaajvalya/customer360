<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verizon Customer Intelligence AI — Wireframe Spec</title>
<style>
  :root{
    --ink:#1a1c20; --ink-soft:#4a4f57; --line:#c7cbd1; --line-soft:#e2e5e9;
    --paper:#ffffff; --panel:#fafbfc; --panel-2:#f2f4f6;
    --accent:#2f5fdc; --accent-soft:#e8edfc;
    --mono: "IBM Plex Mono","SFMono-Regular",Menlo,monospace;
    --sans: "Inter","Helvetica Neue",Arial,sans-serif;
    --r:10px; --r-lg:16px; --sp:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--panel-2);font-size:13px;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .app{display:flex;min-height:100vh;}

  /* ---------- LEFT NAV ---------- */
  .rail{width:242px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .rail.collapsed{width:64px;}
  .rail.collapsed .rail-label{display:none;}
  .rail-brand{display:flex;align-items:center;gap:8px;padding:18px 16px;border-bottom:1px solid var(--line);}
  .brand-mark{width:26px;height:26px;border-radius:6px;background:var(--ink);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-family:var(--mono);}
  .brand-text{line-height:1.15;}
  .brand-text b{display:block;font-size:12px;}
  .brand-text span{font-size:9px;color:var(--ink-soft);}
  .rail-toggle{margin-left:auto;width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:11px;color:var(--ink-soft);}
  .rail-scroll{overflow-y:auto;padding:10px 8px;flex:1;}
  .rail-group-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:#9aa0a8;text-transform:uppercase;padding:12px 10px 4px;}
  .rail-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-size:12.5px;margin-bottom:2px;border:1px solid transparent;}
  .rail-item:hover{background:var(--panel-2);}
  .rail-item.active{background:var(--accent-soft);color:var(--accent);border-color:#c9d8fb;font-weight:600;}
  .rail-ico{width:18px;height:18px;flex:none;border-radius:5px;border:1.4px solid currentColor;opacity:.8;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--mono);}
  .rail-num{margin-left:auto;font-family:var(--mono);font-size:9px;color:#b8bcc2;}
  .rail-item.active .rail-num{color:var(--accent);}
  .rail-foot{padding:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-soft);}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:56px;flex:none;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:5;}
  .search-fake{flex:1;max-width:420px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;align-items:center;padding:0 10px;color:#9aa0a8;font-size:11.5px;gap:6px;}
  .topbar-spacer{flex:1;}
  .top-ico{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);position:relative;flex:none;}
  .top-ico.copilot{background:var(--ink);color:#fff;border-color:var(--ink);font-family:var(--mono);}
  .dot-badge{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid #fff;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);}

  .content{padding:24px;max-width:1280px;width:100%;margin:0 auto;}
  .page-head{margin-bottom:18px;}
  .breadcrumb{font-family:var(--mono);font-size:10px;color:#9aa0a8;margin-bottom:8px;}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;}
  .page-purpose{color:var(--ink-soft);font-size:12.5px;max-width:760px;line-height:1.5;}
  .persona-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:10.5px;font-family:var(--mono);border:1px dashed var(--line);border-radius:20px;padding:4px 10px;color:var(--ink-soft);}

  .wf{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:18px;}
  .wf-label{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#9aa0a8;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .wf-label::after{content:"";flex:1;height:1px;background:var(--line-soft);}

  /* generic wireframe blocks */
  .row{display:flex;gap:12px;margin-bottom:12px;}
  .row:last-child{margin-bottom:0;}
  .col{flex:1;min-width:0;}
  .block{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px;position:relative;}
  .block-title{font-size:11px;font-weight:600;margin-bottom:2px;}
  .block-sub{font-size:9.5px;color:#9aa0a8;font-family:var(--mono);}
  .placeholder-x{position:relative;border:1px dashed var(--line);border-radius:8px;background:repeating-linear-gradient(135deg,#f4f5f6,#f4f5f6 6px,#fff 6px,#fff 12px);}
  .placeholder-x::before,.placeholder-x::after{content:"";position:absolute;inset:0;}
  .tag{display:inline-block;font-family:var(--mono);font-size:9px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-soft);margin-right:4px;background:#fff;}
  .tag.accent{border-color:#c9d8fb;color:var(--accent);background:var(--accent-soft);}

  .kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);}
  .kpi .k-label{font-size:9.5px;color:var(--ink-soft);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;}
  .kpi .k-val{font-size:19px;font-weight:700;margin:4px 0 2px;}
  .kpi .k-delta{font-size:10px;color:var(--ink-soft);}
  .kpi .k-delta.up{color:#2f7d4f;}
  .kpi .k-delta.down{color:#c14545;}
  .kpi .k-spark{height:22px;margin-top:8px;display:flex;align-items:flex-end;gap:2px;}
  .kpi .k-spark i{flex:1;background:var(--line);border-radius:1px;}

  .chart-box{height:150px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px;display:flex;flex-direction:column;}
  .chart-box .cb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .chart-body{flex:1;position:relative;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:100%;padding-top:6px;}
  .bars i{flex:1;background:linear-gradient(180deg,#dfe3e8,#c7cbd1);border-radius:3px 3px 0 0;}
  .bars i.hi{background:linear-gradient(180deg,var(--accent-soft),#b9cbf7);}
  .donut{width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--accent) 0 34%, #b9c1cc 34% 62%, #dfe3e8 62% 100%);margin:4px auto;position:relative;}
  .donut::after{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%;}
  .line-chart{width:100%;height:100%;}
  .heat{display:grid;gap:3px;height:100%;}
  .heat i{border-radius:2px;background:var(--line-soft);}

  table.wtable{width:100%;border-collapse:collapse;font-size:11px;}
  table.wtable th{text-align:left;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:#9aa0a8;font-weight:500;border-bottom:1px solid var(--line);padding:6px 8px;}
  table.wtable td{padding:8px;border-bottom:1px solid var(--line-soft);color:var(--ink);}
  table.wtable tr:last-child td{border-bottom:none;}
  .bar-cell{height:6px;border-radius:3px;background:var(--line-soft);position:relative;overflow:hidden;width:60px;display:inline-block;vertical-align:middle;}
  .bar-cell i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;}
  .pill{font-size:9.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);font-family:var(--mono);}
  .pill.high{border-color:#e5b9b9;color:#c14545;background:#fbefef;}
  .pill.med{border-color:#e9d8ae;color:#a8791b;background:#fbf5e6;}
  .pill.low{border-color:#bfe0c9;color:#2f7d4f;background:#edf8f1;}

  .cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .cardgrid.c2{grid-template-columns:repeat(2,1fr);}
  .cardgrid.c4{grid-template-columns:repeat(4,1fr);}
  .icard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);}
  .icard h5{margin:0 0 4px;font-size:11.5px;}
  .icard p{margin:0 0 8px;font-size:10px;color:var(--ink-soft);line-height:1.4;}
  .icard .meta{display:flex;justify-content:space-between;font-size:9.5px;font-family:var(--mono);color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px;}
  .icard .btnrow{display:flex;gap:6px;margin-top:8px;}

  .btn{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:default;}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.ghost{background:transparent;}

  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .filterbar .fchip{border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:10.5px;display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink-soft);}
  .filterbar .fchip::after{content:"▾";font-size:8px;}

  .avatar-circle{width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);flex:none;}
  .list-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:11px;}
  .list-row:last-child{border-bottom:none;}

  .graph-canvas{height:280px;border:1px solid var(--line);border-radius:var(--r);background:
      radial-gradient(circle at 20% 30%, #eef1f4 0, transparent 40%),
      var(--panel);position:relative;overflow:hidden;}
  .gnode{position:absolute;border-radius:50%;background:#fff;border:1.6px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:8px;font-family:var(--mono);text-align:center;}
  .gnode.center{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;}
  .gedge{position:absolute;height:1px;background:var(--line);transform-origin:0 0;}

  .timeline-h{display:flex;align-items:center;}
  .t-step{flex:1;text-align:center;position:relative;}
  .t-dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);margin:0 auto 6px;position:relative;z-index:1;}
  .t-step.drop .t-dot{border-color:#c14545;background:#fbefef;}
  .t-line{position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .t-step:first-child .t-line{display:none;}
  .t-name{font-size:10px;font-weight:600;}
  .t-sub{font-size:9px;color:var(--ink-soft);font-family:var(--mono);}

  .chat-shell{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);height:280px;display:flex;flex-direction:column;}
  .chat-log{flex:1;padding:12px;overflow:hidden;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:78%;padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.4;}
  .bubble.user{align-self:flex-end;background:var(--ink);color:#fff;border-radius:10px 10px 2px 10px;}
  .bubble.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px 10px 10px 2px;}
  .bubble.ai .cite{display:block;margin-top:6px;font-family:var(--mono);font-size:8.5px;color:var(--accent);}
  .chat-input{border-top:1px solid var(--line);display:flex;align-items:center;padding:8px 10px;gap:8px;}
  .chat-input .fake-input{flex:1;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;}

  .agent-card{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);}
  .agent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
  .status-dot.run{background:#2f7d4f;}
  .status-dot.idle{background:#9aa0a8;}
  .status-dot.wait{background:#a8791b;}

  .annot{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
  .annot-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;}
  .annot-tab{padding:10px 14px;font-size:11px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .annot-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#fff;}
  .annot-body{padding:18px 20px;}
  .annot-body h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono);color:var(--ink-soft);}
  .annot-body ul{margin:0 0 14px;padding-left:16px;}
  .annot-body li{margin-bottom:5px;font-size:12px;line-height:1.5;}
  .annot-body p{font-size:12px;line-height:1.6;margin:0 0 14px;}
  .ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;}
  .ai-card{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);}
  .ai-card .ai-kind{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--accent);letter-spacing:.05em;margin-bottom:4px;}
  .ai-card p{margin:0;font-size:11.5px;}
  .panel-hide{display:none;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>
<div class="app">
  <div class="rail" id="rail">
    <div class="rail-brand">
      <div class="brand-mark">VZ</div>
      <div class="rail-label brand-text"><b>Customer Intelligence AI</b><span>on Customer 360</span></div>
      <button class="rail-toggle" id="railToggle">⟨⟩</button>
    </div>
    <div class="rail-scroll" id="railScroll"></div>
    <div class="rail-label rail-foot">Grayscale wireframe spec · v1.0</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="brand-mark" style="display:none"></div>
      <div class="search-fake">🔍 &nbsp;Search customers, cohorts, insights, SQL…</div>
      <div class="topbar-spacer"></div>
      <div class="top-ico">🔔<span class="dot-badge"></span></div>
      <div class="top-ico copilot">AI</div>
      <div class="top-ico">⚙</div>
      <div class="avatar"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ===================== SCREEN DATA ===================== */
const SCREENS = [
"dashboard","c360","behavior","journey","graph","communities","social","churn",
"twin","opportunity","campaign","recs","copilot","agents","command","settings"
];

const NAV = [
 {k:"dashboard", label:"Dashboard", ico:"01"},
 {k:"c360", label:"Customer 360+", ico:"02"},
 {k:"behavior", label:"Behavior Intelligence", ico:"03"},
 {k:"journey", label:"Customer Journey", ico:"04"},
 {k:"graph", label:"Customer Knowledge Graph", ico:"05"},
 {k:"communities", label:"Hidden Communities", ico:"06"},
 {k:"social", label:"Social Intelligence", ico:"07"},
 {k:"churn", label:"Churn Intelligence", ico:"08"},
 {k:"twin", label:"Digital Personas", ico:"09"},
 {k:"opportunity", label:"Opportunity Finder", ico:"10"},
 {k:"campaign", label:"Campaign Intelligence", ico:"11"},
 {k:"recs", label:"AI Recommendations", ico:"12"},
 {k:"copilot", label:"AI Copilot", ico:"13"},
 {k:"agents", label:"AI Agents", ico:"14"},
 {k:"command", label:"Executive Command Center", ico:"15"},
 {k:"settings", label:"Settings", ico:"⚙"},
];

/* ---------- tiny helpers for repeatable wireframe fragments ---------- */
const spark = (n=10)=>{let h='';for(let i=0;i<n;i++){const v=20+Math.round(Math.random()*80);h+=`<i style="height:${v}%"></i>`;}return h;};
const bars = (n=12,hiIdx=[])=>{let h='';for(let i=0;i<n;i++){const v=15+Math.round(Math.random()*85);h+=`<i class="${hiIdx.includes(i)?'hi':''}" style="height:${v}%"></i>`;}return h;};
const heat = (cols,rows)=>{let h=`<div class="heat" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">`;for(let i=0;i<cols*rows;i++){const o=(0.15+Math.random()*0.85).toFixed(2);h+=`<i style="background:rgba(47,95,220,${o})"></i>`;}return h+`</div>`;};
function kpi(label,val,delta,dir){
 return `<div class="kpi"><div class="k-label">${label}</div><div class="k-val">${val}</div><div class="k-delta ${dir}">${delta}</div><div class="k-spark">${spark(12)}</div></div>`;
}
function chartBox(title,sub,body){
 return `<div class="chart-box"><div class="cb-head"><div><div class="block-title">${title}</div><div class="block-sub">${sub}</div></div><span class="tag">···</span></div><div class="chart-body">${body}</div></div>`;
}
function tableWrap(title,theadHtml,rowsHtml){
 return `<div class="block"><div class="block-title" style="margin-bottom:8px">${title}</div><table class="wtable"><thead><tr>${theadHtml}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
function iCard(title,desc,metaL,metaR,btns){
 return `<div class="icard"><h5>${title}</h5><p>${desc}</p><div class="meta"><span>${metaL}</span><span>${metaR}</span></div>${btns?`<div class="btnrow">${btns}</div>`:''}</div>`;
}
function pill(text,cls){return `<span class="pill ${cls}">${text}</span>`;}
function barCell(pct){return `<span class="bar-cell"><i style="width:${pct}%"></i></span>`;}

/* ===================== SCREEN 1 — EXECUTIVE DASHBOARD ===================== */
function s_dashboard(){
 return `
 <div class="wf"><div class="wf-label">Filter &amp; context bar</div>
  <div class="filterbar">
   <span class="fchip">Segment: All customers</span><span class="fchip">Region: National</span>
   <span class="fchip">Period: Last 30 days</span><span class="fchip">Compare: Prior period</span>
   <span class="tag accent" style="margin-left:auto;align-self:center">AI refreshed 4 min ago</span>
  </div>
 </div>

 <div class="wf"><div class="wf-label">Executive KPI strip</div>
  <div class="cardgrid c4">
   ${kpi("Customer Health Index","78.4","+2.1 pts vs prior","up")}
   ${kpi("Revenue (MTD)","$4.82B","+3.4% vs plan","up")}
   ${kpi("Avg. Customer LTV","$2,140","−1.2% vs prior","down")}
   ${kpi("Active AI Alerts","23","+6 new today","up")}
  </div>
 </div>

 <div class="row">
  <div class="col" style="flex:2">
   <div class="wf"><div class="wf-label">Behavior clusters &amp; emerging trends</div>
    <div class="row">
     <div class="col">${chartBox("Behavior cluster distribution","donut · 6 segments", `<div class="donut"></div><div style="text-align:center;font-size:9px;color:var(--ink-soft);font-family:var(--mono)">Night Streamers · High Value · Family · Roamers · Gamers · Other</div>`)}</div>
     <div class="col">${chartBox("Emerging trend velocity","line · 90 days", `<div class="line-chart"><svg viewBox="0 0 200 90" width="100%" height="100%" preserveAspectRatio="none"><polyline points="0,70 20,60 40,62 60,45 80,50 100,30 120,35 140,20 160,24 180,10 200,15" fill="none" stroke="#2f5fdc" stroke-width="2"/><polyline points="0,80 20,78 40,75 60,74 80,70 100,68 120,66 140,63 160,60 180,58 200,55" fill="none" stroke="#c7cbd1" stroke-width="2"/></svg></div>`)}</div>
    </div>
   </div>
  </div>
  <div class="col">
   <div class="wf"><div class="wf-label">Sentiment pulse</div>
    ${chartBox("Sentiment (7d)","stacked bar", `<div class="bars">${bars(7,[5,6])}</div>`)}
   </div>
  </div>
 </div>

 <div class="row">
  <div class="col" style="flex:1.4">
   <div class="wf"><div class="wf-label">Top churn risks — AI ranked</div>
    ${tableWrap("Watchlist (top 5 of 4,812)",
      `<th>Customer</th><th>Segment</th><th>Risk</th><th>Revenue impact</th><th>Reason</th>`,
      [
       ["Chen Family Plan","Family Decision Makers","high","$18,400/yr","Data usage drop + 2 support escalations"],
       ["Acct #88213 — SMB","Business Upgrade","high","$62,100/yr","Competitor plan searches detected"],
       ["Rivera, M.","High Value Users","med","$4,200/yr","Billing complaint, sentiment −0.6"],
       ["Nguyen Household","Weekend Gamers","med","$3,050/yr","Latency complaints, app uninstall risk"],
       ["Acct #40921","Travel Professionals","low","$1,900/yr","Roaming usage seasonal dip"],
      ].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${pill(r[2],r[2])}</td><td>${r[3]}</td><td style="color:var(--ink-soft)">${r[4]}</td></tr>`).join('')
    )}
   </div>
  </div>
  <div class="col">

/* ===================== APP SHELL LOGIC ===================== */
const railScroll = document.getElementById('railScroll');
NAV.forEach(n=>{
 const el = document.createElement('div');
 el.className='rail-item'; el.dataset.k=n.k;
 el.innerHTML = `<span class="rail-ico">${n.ico}</span><span class="rail-label">${n.label}</span>`;
 el.onclick=()=>select(n.k);
 railScroll.appendChild(el);
});

document.getElementById('railToggle').onclick=()=>document.getElementById('rail').classList.toggle('collapsed');

let activeTab = 'wireframe';
function select(key){
 document.querySelectorAll('.rail-item').forEach(e=>e.classList.toggle('active', e.dataset.k===key));
 const m = META[key];
 const body = RENDER[key] ? RENDER[key]() : '<div class="wf">Screen content</div>';
 const aiCards = [
  ['GenAI', m.ai.genai], ['ML', m.ai.ml], ['Graph AI', m.ai.graph], ['Agentic AI', m.ai.agentic]
 ].map(([k,v])=>`<div class="ai-card"><div class="ai-kind">${k}</div><p>${v}</p></div>`).join('');

 document.getElementById('content').innerHTML = `
  <div class="page-head">
   <div class="breadcrumb">${m.crumb}</div>
   <h1 class="page-title">${m.title}</h1>
   <p class="page-purpose">${m.purpose}</p>
   <span class="persona-chip">◆ ${m.persona}</span>
  </div>

  <div id="wfHost">${body}</div>

  <div class="annot" style="margin-top:20px">
   <div class="annot-tabs">
    <div class="annot-tab active" data-t="widgets">Layout &amp; Widgets</div>
    <div class="annot-tab" data-t="ai">AI Capabilities</div>
    <div class="annot-tab" data-t="ux">UX Notes</div>
    <div class="annot-tab" data-t="int">Interactions</div>
    <div class="annot-tab" data-t="sample">Sample Content</div>
   </div>
   <div class="annot-body">
    <div class="pane" data-p="widgets"><h4>Components on this screen</h4><ul>${m.widgets.map(w=>`<li>${w}</li>`).join('')}</ul></div>
    <div class="pane panel-hide" data-p="ai"><h4>AI capabilities</h4><div class="ai-grid">${aiCards}</div></div>
    <div class="pane panel-hide" data-p="ux"><h4>Why this layout works</h4><ul>${m.ux.map(w=>`<li>${w}</li>`).join('')}</ul></div>
    <div class="pane panel-hide" data-p="int"><h4>Expected user interactions</h4><ul>${m.interactions.map(w=>`<li>${w}</li>`).join('')}</ul></div>
    <div class="pane panel-hide" data-p="sample"><h4>Sample content note</h4><p>${m.sample}</p></div>
   </div>
  </div>
 `;

 document.querySelectorAll('.annot-tab').forEach(t=>{
  t.onclick=()=>{
   document.querySelectorAll('.annot-tab').forEach(x=>x.classList.remove('active'));
   t.classList.add('active');
   document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('panel-hide', p.dataset.p!==t.dataset.t));
  };
 });
 window.scrollTo(0,0);
}

select('dashboard');
